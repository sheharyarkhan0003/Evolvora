# Evolvora Technologies static site
[build]
  publish = "."

# Hands off to the Evolvora Campus app. 302 (not 301) because the app's host is
# an implementation detail we may move; a permanent redirect would let it get
# cached as the canonical home of /login.
[[redirects]]
  from = "/login"
  to = "https://schoolsync.pages.dev/login"
  status = 302
  force = true

# Pricing moved under the product it prices. Permanent so the old URL's
# search equity follows it.
[[redirects]]
  from = "/pricing"
  to = "/products/evolvora-campus/pricing/"
  status = 301
  force = true

[[redirects]]
  from = "/pricing/*"
  to = "/products/evolvora-campus/pricing/"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # Everything the site loads is served from this domain (fonts included), so
    # the policy can be strict. 'unsafe-inline' is for styles only: the pages
    # use inline style attributes and small inline <style> blocks. JSON-LD
    # blocks are data, not scripts, so script-src 'self' does not affect them.
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; form-action 'self'; frame-ancestors 'self'; base-uri 'self'; object-src 'none'; upgrade-insecure-requests"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), browsing-topics=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
