# Evolvora Technologies static site
[build]
  publish = "."

# Hands off to the Evolvora Campus app. 302 (not 301) because the app's host is
# an implementation detail we may move; a permanent redirect would let it get
# cached as the canonical home of /login.
[[redirects]]
  from = "/login"
  to = "https://schoolsync.pages.dev/login"
  status = 302
  force = true

# Pricing moved under the product it prices. Permanent so the old URL's
# search equity follows it.
[[redirects]]
  from = "/pricing"
  to = "/products/evolvora-campus/pricing/"
  status = 301
  force = true

[[redirects]]
  from = "/pricing/*"
  to = "/products/evolvora-campus/pricing/"
  status = 301
  force = true

# /about/index.html and / serve the same page. The canonical tag already
# points at the clean URL; the redirect makes it one URL for real.
[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/products/index.html"
  to = "/products/"
  status = 301
  force = true

[[redirects]]
  from = "/products/evolvora-campus/index.html"
  to = "/products/evolvora-campus/"
  status = 301
  force = true

[[redirects]]
  from = "/products/silaaimarkaz/index.html"
  to = "/products/silaaimarkaz/"
  status = 301
  force = true

[[redirects]]
  from = "/products/evolvora-campus/pricing/index.html"
  to = "/products/evolvora-campus/pricing/"
  status = 301
  force = true

[[redirects]]
  from = "/contact/index.html"
  to = "/contact/"
  status = 301
  force = true

[[redirects]]
  from = "/services/index.html"
  to = "/services/"
  status = 301
